name: Scrape

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  scrape:
    name: Scrape
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v7 # zizmor: ignore[artipacked] -- the scrape pushes its results

      - id: install-uv
        name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.10.7"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - id: install-python
        name: Install Python
        run: uv python install 3.13

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Run scrape command
        run: |
          uv run nifcwildfires active-perimeters > data/perimeters.json
        shell: bash

      - name: Datestamp
        run: date > data/timestamp.txt
        shell: bash

      - name: Commit results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "actions@github.com"
          git config pull.rebase false
          git status
          git pull origin $GITHUB_REF
          git add ./data
          git commit -m "Scrape" --author="palewire <palewire@users.noreply.github.com>" && git push || true
        shell: bash